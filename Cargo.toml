[package]
name = "skk-proxy"
version = "0.1.0"
edition = "2024"
description = "skkserv proxy for macSKK: azoo-key-skkserv primary, yaskkserv2 fallback"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
encoding_rs = "0.8.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
